name: Arch pkgs

on:
  workflow_dispatch:
    inputs:
      build_upower_nncc:
        type: boolean
        default: true
        description: Build upower-nncc
      build_bootc:
        type: boolean
        default: true
        description: Build bootc
      build_code:
        type: boolean
        default: true
        description: Build code
      build_python2:
        type: boolean
        default: true
        description: Build python2
      build_widevine:
        type: boolean
        default: true
        description: Build widevine
      build_linux_nabu_614:
        type: boolean
        default: true
        description: Build linux-nabu 6.14
      build_linux_nabu_616:
        type: boolean
        default: true
        description: Build linux-nabu 6.16
      build_nabu_pmac:
        type: boolean
        default: true
        description: Build nabu-pmac
      build_nabu_tablet_mode:
        type: boolean
        default: true
        description: Build nabu-tablet-mode
      build_browsers:
        type: boolean
        default: true
        description: Build web browsers (google-chrome, brave-bin)
      build_hexagonrpcd:
        type: boolean
        default: true
        description: Build hexagonrpcd
      build_iris_media:
        type: boolean
        default: true
        description: Build Iris media stack (iris-vaapi, ffmpeg-iris, mpv-iris, vlc-nabu)
      build_displaylink:
        type: boolean
        default: true
        description: Build displaylink & evdi-dkms
      build_system_monitor:
        type: boolean
        default: true
        description: Build system-monitor
      build_qcom_daemons:
        type: boolean
        default: true
        description: Build Qualcomm daemons (qrtr, rmtfs, tqftpserv)
      build_alsa_ucm_conf_xiaomi_nabu:
        type: boolean
        default: true
        description: Build alsa-ucm-conf-xiaomi-nabu
      build_linux_firmware_xiaomi_nabu:
        type: boolean
        default: true
        description: Build linux-firmware-xiaomi-nabu
      build_oskb:
        type: boolean
        default: true
        description: Build oskb
      build_nabu_autobrightness:
        type: boolean
        default: true
        description: Build nabu-autobrightness
      build_camera_studio:
        type: boolean
        default: true
        description: Build camera-studio
      build_nabu_torch:
        type: boolean
        default: true
        description: Build nabu-torch
      build_sddm_nabu:
        type: boolean
        default: true
        description: Build sddm-nabu
      build_nabu_boot_tools:
        type: boolean
        default: true
        description: Build nabu-boot-tools

jobs:
  resolve-packages:
    name: Resolve package matrix
    runs-on: ubuntu-24.04-arm
    outputs:
      pkg: ${{ steps.set-matrix.outputs.pkg }}
    steps:
      - name: Resolve which packages to build
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            jq -n -c \
              --argjson upower_nncc "${{ inputs.build_upower_nncc }}" \
              --argjson bootc "${{ inputs.build_bootc }}" \
              --argjson code "${{ inputs.build_code }}" \
              --argjson python2 "${{ inputs.build_python2 }}" \
              --argjson widevine "${{ inputs.build_widevine }}" \
              --argjson linux_nabu_616 "${{ inputs.build_linux_nabu_616 }}" \
              --argjson linux_nabu_614 "${{ inputs.build_linux_nabu_614 }}" \
              --argjson nabu_pmac "${{ inputs.build_nabu_pmac }}" \
              --argjson nabu_tablet_mode "${{ inputs.build_nabu_tablet_mode }}" \
              --argjson browsers "${{ inputs.build_browsers }}" \
              --argjson hexagonrpcd "${{ inputs.build_hexagonrpcd }}" \
              --argjson iris_media "${{ inputs.build_iris_media }}" \
              --argjson displaylink "${{ inputs.build_displaylink }}" \
              --argjson system_monitor "${{ inputs.build_system_monitor }}" \
              --argjson qcom_daemons "${{ inputs.build_qcom_daemons }}" \
              --argjson alsa_ucm_conf_xiaomi_nabu "${{ inputs.build_alsa_ucm_conf_xiaomi_nabu }}" \
              --argjson linux_firmware_xiaomi_nabu "${{ inputs.build_linux_firmware_xiaomi_nabu }}" \
              --argjson oskb "${{ inputs.build_oskb }}" \
              --argjson nabu_autobrightness "${{ inputs.build_nabu_autobrightness }}" \
              --argjson camera_studio "${{ inputs.build_camera_studio }}" \
              --argjson nabu_torch "${{ inputs.build_nabu_torch }}" \
              --argjson sddm_nabu "${{ inputs.build_sddm_nabu }}" \
              --argjson nabu_boot_tools "${{ inputs.build_nabu_boot_tools }}" \
              '[ if $upower_nncc then "upower-nncc" else empty end,
                 if $bootc then "bootc" else empty end,
                 if $code then "code" else empty end,
                 if $python2 then "python2" else empty end,
                 if $widevine then "widevine" else empty end,
                 if $linux_nabu_614 then "linux-nabu-614" else empty end,
                 if $nabu_pmac then "nabu-pmac" else empty end,
                 if $nabu_tablet_mode then "nabu-tablet-mode" else empty end,
                 if $browsers then "google-chrome", "brave-bin" else empty end,
                 if $linux_nabu_616 then "linux-nabu-616" else empty end,
                 if $hexagonrpcd then "hexagonrpcd" else empty end,
                 if $iris_media then "iris-vaapi", "ffmpeg-iris", "mpv-iris", "vlc-nabu" else empty end,
                 if $displaylink then "displaylink", "evdi-dkms" else empty end,
                 if $system_monitor then "system-monitor" else empty end,
                 if $qcom_daemons then "qrtr", "rmtfs", "tqftpserv" else empty end,
                 if $alsa_ucm_conf_xiaomi_nabu then "alsa-ucm-conf-xiaomi-nabu" else empty end,
                 if $linux_firmware_xiaomi_nabu then "linux-firmware-xiaomi-nabu" else empty end,
                 if $oskb then "oskb" else empty end,
                 if $nabu_autobrightness then "nabu-autobrightness" else empty end,
                 if $camera_studio then "camera-studio" else empty end,
                 if $nabu_torch then "nabu-torch" else empty end,
                 if $sddm_nabu then "sddm-nabu" else empty end,
                 if $nabu_boot_tools then "nabu-boot-tools" else empty end ]' > matrix.json
          else
            echo '["upower-nncc","bootc","code","python2","widevine","linux-nabu-614","nabu-pmac","nabu-tablet-mode","google-chrome","hexagonrpcd","iris-vaapi","evdi-dkms","displaylink","system-monitor","qrtr","rmtfs","tqftpserv","brave-bin","alsa-ucm-conf-xiaomi-nabu","linux-firmware-xiaomi-nabu","oskb","nabu-autobrightness","camera-studio","nabu-torch","sddm-nabu","ffmpeg-iris","mpv-iris","vlc-nabu","nabu-boot-tools"]' > matrix.json
          fi
          pkg=$(cat matrix.json)
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

  build-packages:
    name: Build ${{ matrix.pkg }}
    needs: resolve-packages
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.resolve-packages.outputs.pkg) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman git curl

      - name: Compute source signature
        id: sig
        run: |
          pkg="${{ matrix.pkg }}"
          pkgver=$(grep -m1 '^pkgver=' "packages/$pkg/PKGBUILD" | sed 's/.*=//' | tr -d '"')
          pkgrel=$(grep -m1 '^pkgrel=' "packages/$pkg/PKGBUILD" | sed 's/.*=//' | tr -d '"')
          case "$pkg" in
            upower-nncc)
              rev=$(git ls-remote https://gitlab.freedesktop.org/upower/upower.git HEAD 2>/dev/null | awk '{print $1}' | cut -c1-12)
              sig="$pkg-$rev-$pkgver-$pkgrel"
              ;;
            google-chrome)
              ver=$(curl -sL "https://dl.google.com/linux/chrome/deb/dists/stable/main/binary-arm64/Packages" 2>/dev/null | awk '/^Package: google-chrome-stable$/ {p=1; next} p && /^Version:/ {print $2; exit}' | cut -d '-' -f1)
              sig="$pkg-${ver:-$pkgver}-$pkgrel"
              ;;
            code)
              ver=$(curl -s "https://update.code.visualstudio.com/api/update/linux-arm64/stable/0000000000000000000000000000000000000000" 2>/dev/null | sed -n 's/.*"productVersion":"\([^"]*\)".*/\1/p')
              sig="$pkg-${ver:-$pkgver}-$pkgrel"
              ;;
            nabu-pmac)
              sig="$pkg-$pkgver-$pkgrel"
              ;;
            oskb|nabu-autobrightness|nabu-torch|sddm-nabu|ffmpeg-iris|mpv-iris|nabu-boot-tools)
              shasum=$(find "packages/$pkg" -type f -exec sha256sum {} + | sort | sha256sum | awk '{print $1}' | cut -c1-12)
              sig="$pkg-$pkgver-$pkgrel-$shasum"
              ;;
            *)
              # Key the build cache by source commit so ANY PKGBUILD/source
              # change (even without a pkgrel bump) forces a real rebuild
              # instead of serving stale cached artifacts.
              sha=$(git rev-parse --short=12 HEAD 2>/dev/null || echo unknown)
              sig="$pkg-$pkgver-$pkgrel-$sha"
              ;;
          esac
          echo "sig=$sig" >> "$GITHUB_OUTPUT"
          echo "Source signature: $sig"

      - name: Restore cached build
        id: cache
        uses: actions/cache@v6
        with:
          path: pkg-cache
          key: ${{ matrix.pkg }}-${{ steps.sig.outputs.sig }}

      - name: Decide whether to build
        id: decide
        run: |
          if [[ "${{ steps.cache.outputs.cache-hit }}" == "true" ]] && ls pkg-cache/*.pkg.tar.* >/dev/null 2>&1; then
            echo "need-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "need-build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.decide.outputs.need-build == 'true'
        run: |
          mkdir -p pkg-cache
          echo "::group::Building ${{ matrix.pkg }}..."
          podman run --rm \
            -v "$(pwd)/packages/${{ matrix.pkg }}:/work" \
            -v "$(pwd)/pkg-cache:/output" \
            -w /work \
            menci/archlinuxarm:base \
            sh -c "
              sed -i '/^#DisableSandbox/s/^#//' /etc/pacman.conf
              echo 'DisableSandbox' >> /etc/pacman.conf
              printf '\n[nabu]\nSigLevel = Never\nServer = https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo\n' >> /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel git bc python3 xmlto docbook-xsl kmod inetutils dtc systemd-ukify libelf
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /work
              su builder -c 'cd /work && (makepkg -s --noconfirm --skipchecksums || makepkg -d --noconfirm --skipchecksums)' || exit 1
              cp /work/*.pkg.tar.* /output/
            "
          echo "::endgroup::"
          ls -la pkg-cache/

      - name: Save cache
        if: steps.decide.outputs.need-build == 'true'
        uses: actions/cache/save@v6
        with:
          path: pkg-cache
          key: ${{ matrix.pkg }}-${{ steps.sig.outputs.sig }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.pkg }}
          path: pkg-cache/*
          if-no-files-found: error

  assemble-repo:
    name: Assemble pacman repository
    runs-on: ubuntu-24.04-arm
    needs: build-packages
    if: ${{ !cancelled() && !contains(needs.build-packages.result, 'cancelled') }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman gnupg libarchive-tools
          (type -p wget >/dev/null || sudo apt-get install wget -y) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-keys

      - name: Setup repo structure
        run: |
          mkdir -p repo/aarch64
          cp repo/nabu-repo.asc repo/aarch64/ 2>/dev/null || true

      - name: Download existing repo packages (baseline)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo/aarch64
          echo "Fetching previous release packages as baseline..."
          gh release download repo -R "$GITHUB_REPOSITORY" \
            --pattern "*.pkg.tar.zst" \
            --pattern "*.pkg.tar.xz" \
            --pattern "*.sig" \
            --dir . 2>/dev/null || echo "  No previous release packages"
          ls -la *.pkg.tar.* 2>/dev/null || echo "  (empty baseline)"

      - name: Download generic rootfs tarball
        run: |
          cd repo/aarch64
          if ! wget --timeout=30 --tries=2 --waitretry=5 "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz; then
            echo "Primary mirror failed, falling back"
            wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz 2>/dev/null || true
          fi

      - name: Download local package artifacts
        uses: actions/download-artifact@v8
        with:
          path: repo/new-pkgs
          pattern: pkg-*
          merge-multiple: true

      - name: Drop superseded versions of rebuilt packages
        run: |
          cd repo/aarch64
          # Blacklist: versions that must never be served (problematic
          # releases; both .pkg and .sig).
          rm -f linux-nabu-6.16.* linux-nabu-headers-6.16.* linux-nabu-uki-6.16.* \
                 linux-nabu-6.14.11-9* linux-nabu-headers-6.14.11-9* linux-nabu-uki-6.14.11-9* 2>/dev/null || true
          # Packages rebuilt in this run supersede every older version of the
          # same pkgname (including third-party binaries the same filename
          # previously carried). Kernel versions are kept for rollback only
          # per the retention rule below.
          shopt -s nullglob
          cd ../new-pkgs
          for f in *.pkg.tar.zst *.pkg.tar.xz; do
            pkgname=$(bsdtar -xOf "$f" .PKGINFO 2>/dev/null | sed -n 's/^pkgname = //p' | tr -d '\r' | head -n1)
            [ -z "$pkgname" ] && continue
            case "$pkgname" in
              linux-nabu|linux-nabu-headers|linux-nabu-uki) echo "Keeping kernel: $f"; continue ;;
            esac
            echo "Rebuilt $pkgname ($(basename "$f"))"
            for old in ../aarch64/"${pkgname}"-*.pkg.tar.*; do
              [ "$old" = "../aarch64/$f" ] && continue
              echo "  removing superseded $(basename "$old")"
              rm -f "$old" "${old}.sig"
            done
          done
          # Overlay newly built packages onto the repo.
          cp ../new-pkgs/*.pkg.tar.* ../aarch64/
          # Retention: keep the newest 2 kernel versions per pkgname as
          # rollback backups; prune everything older (blacklist already gone).
          cd ../aarch64
          for name in linux-nabu linux-nabu-headers linux-nabu-uki; do
            keep=$(ls -1v "${name}"-[0-9]*.pkg.tar.xz "${name}"-[0-9]*.pkg.tar.zst 2>/dev/null | tail -n 2 | tr '\n' ' ')
            for f in "${name}"-[0-9]*.pkg.tar.xz "${name}"-[0-9]*.pkg.tar.zst; do
              case " $keep " in
                *" $f "*) ;;
                *) echo "  pruning $(basename "$f")"; rm -f "$f" "${f}.sig" ;;
              esac
            done
          done

      - name: Fix permissions
        run: sudo chown -R "$USER:$USER" repo/aarch64/

      - name: Re-sign packages
        run: |
          cd repo/aarch64
          GPG_KEY_ID="${{ secrets.REPO_GPG_KEY_ID }}"
          shopt -s nullglob
          for pkg in *.pkg.tar.zst *.pkg.tar.xz; do
            echo "Signing $pkg..."
            gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user "$GPG_KEY_ID" \
              --detach-sign --output "${pkg}.sig" "$pkg"
          done

      - name: Create pacman database
        run: |
          podman run --rm \
            -v "$(pwd)/repo/aarch64:/repo" \
            -w /repo \
            menci/archlinuxarm:base \
            sh -c "
              sed -i '/^#DisableSandbox/s/^#//' /etc/pacman.conf
              echo 'DisableSandbox' >> /etc/pacman.conf
              pacman-key --init
              pacman-key --populate
              pacman -Syu --noconfirm
              pacman -S --noconfirm pacman-contrib
              shopt -s nullglob
              rm -f nabu.db* nabu.files*
              # repo-add keeps only the last-processed version per pkgname, so
              # feed files in version order (not lexical: 6.14.11-10 < -5) so
              # the newest package wins.
              ls -1v *.pkg.tar.zst *.pkg.tar.xz | xargs repo-add nabu.db.tar.gz
            "
          # Fail (never publish) if the database could not be built: an empty
          # db must not replace the working release below.

      - name: Fix permissions
        run: sudo chown -R "$USER:$USER" repo/aarch64/

      - name: Sign database files
        run: |
          GPG_KEY_ID="${{ secrets.REPO_GPG_KEY_ID }}"
          cd repo/aarch64
          for db in nabu.db.tar.gz nabu.files.tar.gz; do
            [ -f "$db" ] && gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user "$GPG_KEY_ID" \
              --detach-sign --output "${db}.sig" "$db"
          done

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo/aarch64
          gh release delete repo --yes 2>/dev/null || true
          git push --delete origin repo 2>/dev/null || true

          shopt -s nullglob
          ASSETS=(
            nabu.db
            nabu.db.tar.gz
            nabu.db.tar.gz.sig
            nabu.files
            nabu.files.tar.gz
            nabu.files.tar.gz.sig
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
            *.pkg.tar.xz
            *.pkg.tar.xz.sig
            ArchLinuxARM-aarch64-latest.tar.gz
          )
          [ -f nabu-repo.asc ] && ASSETS+=(nabu-repo.asc)
          gh release create repo \
            --title "Pacman Repository" \
            --notes "Automated build of the nabu pacman repository" \
            "${ASSETS[@]}"
