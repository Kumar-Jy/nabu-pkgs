name: Build linux-nabu-614 (CFM880 iris+camera)

# Minimal build-only job: compiles the linux-nabu-614 kernel on a native
# aarch64 runner using the postmarketOS sm8150/6.14.11 base @ 5181e135
# (fetched from GitLab archive) + the CFM880 nabu-camera/nabu-iris/
# nabu-accelerometer source overlays (incl. FastRPC/PDR patch), building the
# derived sm8150-xiaomi-nabu-iris-camera-accelerometer-slpi-boot-only.dtb and
# the qcom-iris/ov13b10/ov8856/cn3927/camss/fastrpc/qcom_pd_mapper modules.
# Uploads the resulting .pkg.tar.* as an artifact. Does NOT touch the pacman
# repo.

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/linux-nabu-614/**'

jobs:
  build-linux-nabu-614:
    name: Build linux-nabu-614
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman git

      - name: Build package
        run: |
          mkdir -p pkg-out
          echo "::group::Building linux-nabu-614 (CFM880 baseline + iris + camera)..."
          podman run --rm \
            -v "$(pwd)/packages/linux-nabu-614:/work" \
            -v "$(pwd)/pkg-out:/output" \
            -w /work \
            menci/archlinuxarm:base \
            sh -c "
              sed -i '/^#DisableSandbox/s/^#//' /etc/pacman.conf
              echo 'DisableSandbox' >> /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel git bc python3 xmlto docbook-xsl kmod inetutils dtc libelf
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /work
              su builder -c 'cd /work && makepkg -s --noconfirm --skipchecksums' || exit 1
              cp /work/*.pkg.tar.* /output/
            "
          echo "::endgroup::"
          ls -la pkg-out/

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-nabu-614
          path: pkg-out/*.pkg.tar.*
          if-no-files-found: error