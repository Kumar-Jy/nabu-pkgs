name: Ubuntu APT Repository

on:
  workflow_dispatch:
    inputs:
      import_kernel:
        type: boolean
        default: true
        description: "Import latest available linux-nabu .deb from Kumar-Jy/linux"
      kernel_version:
        type: string
        default: "latest"
        description: "Target kernel version ('latest', '7.3', '7.2', etc.)"
      clean_stale_assets:
        type: boolean
        default: true
        description: "Remove release assets not rebuilt in this run (superseded kernels, renamed .debs, stale signatures)"
  push:
    branches:
      - ubuntu

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Ubuntu Repository
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils curl python3 python3-pip jq xz-utils unzip p7zip-full \
            build-essential gcc meson ninja-build pkgconf \
            libglib2.0-dev libqmi-glib-dev libmbim-glib-dev libqrtr-glib-dev libprotobuf-c-dev \
            protobuf-compiler protobuf-c-compiler \
            libgudev-1.0-dev libpolkit-gobject-1-dev \
            libva-dev libdrm-dev libvulkan-dev
          sudo pip3 install --break-system-packages --upgrade meson || true

      - name: Create Repo Staging Directory
        run: |
          mkdir -p apt-repo

      - name: Import Kernel Debian Packages
        if: github.event_name == 'push' || inputs.import_kernel
        id: import_kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/*.py
          version_filter="${{ github.event.inputs.kernel_version || 'latest' }}"
          python3 .github/scripts/import-kernel-deb.py \
            --repo "Kumar-Jy/linux" \
            --pkgver "$version_filter" \
            --output-dir apt-repo || echo "Kernel import failed or not found, continuing."

      - name: Reuse Published Kernel Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The index below is regenerated from apt-repo/ only. If no kernel was
          # imported (import_kernel=false, or the tolerated import failure), the
          # kernel would silently disappear from Packages even though its assets
          # are kept on the release. Re-stage the published kernel debs instead.
          if compgen -G "apt-repo/linux-image-*.deb" >/dev/null; then
            echo "Kernel packages already staged"
            exit 0
          fi
          echo "::warning::No kernel imported; reusing the kernel assets already published"
          gh release download ubuntu \
            --repo "${{ github.repository }}" \
            --pattern 'linux-*.deb' \
            --dir apt-repo \
            --clobber \
            || echo "::warning::No published kernel assets to reuse"

      - name: Build Device Debian Packages
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py packages/*/build.sh 2>/dev/null || true
          bash ./.github/scripts/build-deb-packages.sh "$PWD/apt-repo"

      - name: Generate APT Metadata
        run: |
          bash ./.github/scripts/generate-apt-repo.sh "$PWD/apt-repo"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ubuntu"
          REPO="${{ github.repository }}"
          TITLE="Xiaomi Pad 5 Ubuntu APT Repository"

          KERNEL_VER="${{ steps.import_kernel.outputs.kernel_version }}"
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER=$(ls apt-repo/linux-image-*.deb 2>/dev/null | head -n1 | sed -n 's/.*linux-image-\([0-9]\+\.[0-9]\+[^_]*\).*/\1/p')
            [ -n "$KERNEL_VER" ] || KERNEL_VER="latest"
          fi

          cat > release-notes.md << EOF
          # Ubuntu APT Repository for Xiaomi Pad 5 (nabu)

          This release contains the **official APT repository** for running Ubuntu on the Xiaomi Pad 5 (\`sm8150\`).

          ---

          ## 🚀 How to Add This Repository to Ubuntu

          Create \`/etc/apt/sources.list.d/nabu.sources\`:

          \`\`\`deb822
          Types: deb
          URIs: https://github.com/Kumar-Jy/nabu-pkgs/releases/download/ubuntu/
          Suites: ./
          Trusted: yes
          \`\`\`

          Then run:
          \`\`\`bash
          sudo apt update
          sudo apt upgrade
          \`\`\`

          ---

          ## 📦 Available Packages

          - **Kernel:** \`linux-image-*\`, \`linux-headers-*\`, \`linux-libc-dev\` (currently \`${KERNEL_VER}\`, built from \`Kumar-Jy/linux\`)
          - **Video & Browsers:** \`iris-vaapi\` (Qualcomm SM8150 Iris VA-API hardware video decode driver with out-of-the-box Chrome, Brave, and Firefox acceleration)
          - **Media (optional):** \`ffmpeg-iris\` (IRIS-patched FFmpeg 8.0.1 with v4l2-mem2mem + DRM-Prime P010 10-bit decode), \`mpv-iris\` (mpv launcher wired to the patched FFmpeg tree)
          - **Browsers (optional):** \`google-chrome-stable\` (official Google Chrome arm64 build), \`brave-bin\` (prebuilt Brave arm64 release) — install on demand with \`sudo apt install google-chrome-stable brave-bin\`; both are hardware-accelerated by \`iris-vaapi\`
          - **Audio:** \`xiaomi-nabu-alsa\` (ALSA UCM2 quad-speaker profiles & mic capture)
          - **Firmware:** \`xiaomi-nabu-firmware\` (DSP, sensor, Ath10k & Cirrus calibration blobs)
          - **Sensors & Daemons:** \`hexagonrpcd\`, \`iio-sensor-proxy\`, \`libssc\`
          - **Hardware Controls:** \`nabu-pmac\`, \`nabu-tablet-mode\`, \`nabu-torch\`, \`nabu-autobrightness\`
          - **System Tools:** \`system-monitor\` (GTK4/Libadwaita real-time hardware telemetry and GPU diagnostics)
          EOF

          cd apt-repo

          # Prune stale release assets if requested: any .deb that was not
          # rebuilt in this run (superseded kernels, renamed package files) and
          # stale repository signatures that are no longer generated.
          if [ "${{ github.event.inputs.clean_stale_assets != 'false' }}" = "true" ] && gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            remote_debs=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name | select(endswith(".deb"))' 2>/dev/null || true)
            # Never prune kernel assets when this run did not import a kernel
            # (workflow_dispatch with import_kernel=false, or a failed import).
            have_kernel=false
            compgen -G "linux-image-*.deb" >/dev/null && have_kernel=true
            for rdeb in $remote_debs; do
              if [ -f "$rdeb" ]; then
                continue
              fi
              case "$rdeb" in
                linux-*)
                  if [ "$have_kernel" != true ]; then
                    echo "Keeping $rdeb (no kernel built in this run)"
                    continue
                  fi
                  ;;
              esac
              echo "Removing stale deb from release: $rdeb"
              gh release delete-asset "$TAG" "$rdeb" --repo "$REPO" --yes 2>/dev/null || true
            done
            for stale in Release.gpg InRelease; do
              if [ ! -f "$stale" ]; then
                gh release delete-asset "$TAG" "$stale" --repo "$REPO" --yes 2>/dev/null || true
              fi
            done
          fi

          # Collect all files to upload
          upload_files=(Packages Packages.gz Release *.deb)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release assets..."
            gh release upload "$TAG" "${upload_files[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file ../release-notes.md
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${upload_files[@]}" --repo "$REPO" --title "$TITLE" --notes-file ../release-notes.md
          fi
