name: Ubuntu APT Repository

on:
  workflow_dispatch:
    inputs:
      import_kernel:
        type: boolean
        default: true
        description: "Import latest available linux-nabu .deb from Kumar-Jy/linux"
      kernel_version:
        type: string
        default: "latest"
        description: "Target kernel version ('latest', '7.3', '7.2', etc.)"
      clean_old_kernels:
        type: boolean
        default: true
        description: "Remove superseded kernel .debs from release assets"
  push:
    branches:
      - ubuntu

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Ubuntu Repository
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils curl python3 python3-pip jq xz-utils \
            build-essential gcc meson ninja-build pkgconf \
            libglib2.0-dev libqmi-glib-dev libmbim-glib-dev libqrtr-glib-dev libprotobuf-c-dev \
            protobuf-compiler protobuf-c-compiler \
            libgudev-1.0-dev libpolkit-gobject-1-dev
          sudo pip3 install --break-system-packages --upgrade meson || true

      - name: Create Repo Staging Directory
        run: |
          mkdir -p apt-repo

      - name: Import Kernel Debian Packages
        if: github.event_name == 'push' || inputs.import_kernel
        id: import_kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/*.py
          version_filter="${{ github.event.inputs.kernel_version || 'latest' }}"
          python3 .github/scripts/import-kernel-deb.py \
            --repo "Kumar-Jy/linux" \
            --pkgver "$version_filter" \
            --output-dir apt-repo || echo "Kernel import failed or not found, continuing."

      - name: Build Device Debian Packages
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py packages/*/build.sh 2>/dev/null || true
          bash ./.github/scripts/build-deb-packages.sh "$PWD/apt-repo"

      - name: Generate APT Metadata
        run: |
          bash ./.github/scripts/generate-apt-repo.sh "$PWD/apt-repo"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ubuntu"
          REPO="${{ github.repository }}"
          TITLE="Xiaomi Pad 5 Ubuntu APT Repository"

          KERNEL_VER="${{ steps.import_kernel.outputs.kernel_version }}"
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER=$(ls apt-repo/linux-image-*.deb 2>/dev/null | head -n1 | sed -n 's/.*linux-image-\([0-9]\+\.[0-9]\+[^_]*\).*/\1/p' || echo "latest")
          fi

          cat > release-notes.md << EOF
          # Ubuntu APT Repository for Xiaomi Pad 5 (nabu)

          This release contains the **official APT repository** for running Ubuntu on the Xiaomi Pad 5 (\`sm8150\`).

          ---

          ## 🚀 How to Add This Repository to Ubuntu

          Create \`/etc/apt/sources.list.d/nabu.sources\`:

          \`\`\`deb822
          Types: deb
          URIs: https://github.com/Kumar-Jy/nabu-pkgs/releases/download/ubuntu/
          Suites: ./
          Trusted: yes
          \`\`\`

          Then run:
          \`\`\`bash
          sudo apt update
          sudo apt upgrade
          \`\`\`

          ---

          ## 📦 Available Packages

          - **Kernel:** \`linux-image-*\`, \`linux-headers-*\`, \`linux-libc-dev\` (currently \`${KERNEL_VER}\`, built from \`Kumar-Jy/linux\`)
          - **Audio:** \`xiaomi-nabu-alsa\` (ALSA UCM2 quad-speaker profiles & mic capture)
          - **Firmware:** \`xiaomi-nabu-firmware\` (DSP, sensor, Ath10k & Cirrus calibration blobs)
          - **Sensors & Daemons:** \`hexagonrpcd\`, \`iio-sensor-proxy\`, \`libssc\`
          - **Hardware Controls:** \`nabu-pmac\`, \`nabu-tablet-mode\`, \`nabu-torch\`, \`nabu-autobrightness\`
          EOF

          cd apt-repo

          # Prune superseded remote kernel deb assets if requested
          if [ "${{ github.event.inputs.clean_old_kernels != 'false' }}" = "true" ] && gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            remote_debs=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name | startswith("linux-") and endswith(".deb")) | .name' 2>/dev/null || true)
            for rdeb in $remote_debs; do
              if [ ! -f "$rdeb" ]; then
                echo "Removing superseded kernel deb from release: $rdeb"
                gh release delete-asset "$TAG" "$rdeb" --repo "$REPO" --yes 2>/dev/null || true
              fi
            done
          fi

          # Collect all files to upload
          upload_files=(Packages Packages.gz Release *.deb)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release assets..."
            gh release upload "$TAG" "${upload_files[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file ../release-notes.md
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${upload_files[@]}" --repo "$REPO" --title "$TITLE" --notes-file ../release-notes.md
          fi
