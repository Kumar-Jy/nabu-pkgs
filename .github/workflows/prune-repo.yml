name: Prune repo (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    name: Remove broken linux-nabu versions
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman gnupg
          (type -p wget >/dev/null || sudo apt-get install wget -y) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-keys

      - name: Download existing repo packages (baseline)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo/aarch64
          cp repo/nabu-repo.asc repo/aarch64/ 2>/dev/null || true
          cd repo/aarch64
          gh release download repo -R "$GITHUB_REPOSITORY" \
            --pattern "*.pkg.tar.zst" \
            --pattern "*.pkg.tar.xz" \
            --pattern "*.sig" \
            --dir . 2>/dev/null || echo "  No previous release packages"
          ls *.pkg.tar.* 2>/dev/null || echo "  (empty baseline)"

      - name: Download generic rootfs tarball
        run: |
          cd repo/aarch64
          wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz 2>/dev/null || true

      - name: Remove broken linux-nabu versions
        run: |
          cd repo/aarch64
          rm -f linux-nabu-6.18.42-1*.pkg.tar.* linux-nabu-6.18.42-1*.sig
          rm -f linux-nabu-6.16.0-4*.pkg.tar.* linux-nabu-6.16.0-4*.sig
          echo "Remaining linux-nabu packages:"
          ls linux-nabu*.pkg.tar.* 2>/dev/null || echo "  none"

      - name: Fix permissions
        run: sudo chown -R "$USER:$USER" repo/aarch64/

      - name: Re-sign packages
        run: |
          cd repo/aarch64
          GPG_KEY_ID="${{ secrets.REPO_GPG_KEY_ID }}"
          shopt -s nullglob
          for pkg in *.pkg.tar.zst *.pkg.tar.xz; do
            echo "Signing $pkg..."
            gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user "$GPG_KEY_ID" \
              --detach-sign --output "${pkg}.sig" "$pkg"
          done

      - name: Create pacman database
        run: |
          podman run --rm \
            -v "$(pwd)/repo/aarch64:/repo" \
            -w /repo \
            menci/archlinuxarm:base \
            sh -c "
              sed -i '/^#DisableSandbox/s/^#//' /etc/pacman.conf
              echo 'DisableSandbox' >> /etc/pacman.conf
              pacman-key --init
              pacman-key --populate
              pacman -Syu --noconfirm
              pacman -S --noconfirm pacman-contrib
              shopt -s nullglob
              rm -f nabu.db* nabu.files*
              repo-add nabu.db.tar.gz *.pkg.tar.zst *.pkg.tar.xz
            " || true
          if [ ! -f repo/aarch64/nabu.db.tar.gz ]; then
            touch repo/aarch64/nabu.db.tar.gz
          fi

      - name: Fix permissions
        run: sudo chown -R "$USER:$USER" repo/aarch64/

      - name: Sign database files
        run: |
          GPG_KEY_ID="${{ secrets.REPO_GPG_KEY_ID }}"
          cd repo/aarch64
          for db in nabu.db.tar.gz nabu.files.tar.gz; do
            [ -f "$db" ] && gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user "$GPG_KEY_ID" \
              --detach-sign --output "${db}.sig" "$db"
          done

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo/aarch64
          gh release delete repo --yes 2>/dev/null || true
          git push --delete origin repo 2>/dev/null || true

          shopt -s nullglob
          ASSETS=(
            nabu.db
            nabu.db.tar.gz
            nabu.db.tar.gz.sig
            nabu.files
            nabu.files.tar.gz
            nabu.files.tar.gz.sig
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
            *.pkg.tar.xz
            *.pkg.tar.xz.sig
            ArchLinuxARM-aarch64-latest.tar.gz
          )
          [ -f nabu-repo.asc ] && ASSETS+=(nabu-repo.asc)
          gh release create repo \
            --title "Pacman Repository" \
            --notes "Automated build of the nabu pacman repository" \
            "${ASSETS[@]}"
