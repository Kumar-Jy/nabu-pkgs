# /etc/nabu-tablet-mode.conf
# Configuration for Xiaomi Pad 5 (nabu) Tablet Mode Daemon
#
# Supported modes:
#   auto   - Automatically switch to Laptop Mode when ANY physical keyboard
#            (magnetic pogo pins, Bluetooth, or USB) is connected, and switch
#            to Tablet Mode (auto-rotation enabled) when disconnected.
#   tablet - Force Tablet Mode always (auto-rotation always active, even if
#            a keyboard is attached).
#   laptop - Force Laptop Mode always (locked to landscape).
#
mode=auto
