# Buffer and latency alignment for Waydroid Android Audio HAL
pulse.rules = [
    {
        matches = [
            { application.name = "Waydroid" }
            { application.process.binary = "threaded-ml" }
        ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
                pulse.min.req     = 1024/48000
                node.latency      = 1024/48000
            }
        }
    }
]
