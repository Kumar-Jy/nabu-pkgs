# ALSA hardware buffer & headroom tuning for Qualcomm SM8150 (Xiaomi Pad 5)
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size            = 480
        api.alsa.period-num             = 8
        api.alsa.headroom               = 480
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
