[Service]
# FASTRPC_IOCTL_INIT_ATTACH_SNS is gated by the SLPI root-PD PDR event in
# the Nabu kernel. Retry only if that event or the attach itself fails.
Restart=on-failure
RestartSec=1s
Environment="hexagonrpcd_device=/dev/fastrpc-sdsp"
Environment="hexagonrpcd_dsp=sdsp"
Environment="hexagonrpcd_fw_dir=/lib/firmware/hexagonfs"
Environment="hexagonrpcd_extra=-s"
