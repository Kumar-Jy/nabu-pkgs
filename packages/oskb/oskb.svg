<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kbBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2533"/>
      <stop offset="100%" stop-color="#0e121a"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#202735"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Keyboard Frame -->
  <rect x="8" y="16" width="112" height="96" rx="20" fill="url(#kbBgGrad)" stroke="#38455a" stroke-width="2.2" filter="url(#shadow)"/>
  
  <!-- Subtle Top Rim Highlight -->
  <path d="M 28 18 L 100 18 A 18 18 0 0 1 118 36" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Row 1: Function / Number Row (Small keys) -->
  <rect x="16" y="26" width="14" height="11" rx="3.5" fill="#ef4444" opacity="0.9"/>
  <rect x="33" y="26" width="13" height="11" rx="3.5" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="49" y="26" width="13" height="11" rx="3.5" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="65" y="26" width="13" height="11" rx="3.5" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="81" y="26" width="13" height="11" rx="3.5" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="97" y="26" width="15" height="11" rx="3.5" fill="#f59e0b" opacity="0.9"/>

  <!-- Row 2: Q W E R T Y Keycaps -->
  <rect x="16" y="41" width="16" height="13" rx="4" fill="url(#accentGrad)"/>
  <rect x="35" y="41" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="50" y="41" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="65" y="41" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="80" y="41" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="95" y="41" width="17" height="13" rx="4" fill="url(#navGrad)"/>

  <!-- Row 3: A S D F G H Keycaps -->
  <rect x="16" y="58" width="18" height="13" rx="4" fill="url(#keyGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="37" y="58" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="52" y="58" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="67" y="58" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="82" y="58" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="97" y="58" width="15" height="13" rx="4" fill="url(#accentGrad)"/>

  <!-- Row 4: Shift, Z, X, C, Arrows -->
  <rect x="16" y="75" width="22" height="13" rx="4" fill="url(#accentGrad)"/>
  <rect x="41" y="75" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="56" y="75" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="71" y="75" width="12" height="13" rx="4" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="86" y="75" width="11" height="13" rx="4" fill="url(#navGrad)"/>
  <rect x="100" y="75" width="12" height="13" rx="4" fill="url(#navGrad)"/>

  <!-- Row 5: Modifiers, Spacebar, Nav -->
  <rect x="16" y="92" width="15" height="12" rx="3.5" fill="url(#keyGrad)" stroke="#38bdf8" stroke-width="1"/>
  <rect x="34" y="92" width="12" height="12" rx="3.5" fill="url(#keyGrad)" stroke="#3b485d" stroke-width="0.8"/>
  <rect x="49" y="92" width="37" height="12" rx="4" fill="url(#keyGrad)" stroke="#4a576d" stroke-width="1"/>
  <rect x="89" y="92" width="10" height="12" rx="3.5" fill="url(#navGrad)"/>
  <rect x="102" y="92" width="10" height="12" rx="3.5" fill="url(#navGrad)"/>

  <!-- Navigation Arrow Glyph on Up Key -->
  <path d="M 91.5 81.5 L 94 78.5 L 96.5 81.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
