<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Deep Vibrant Sapphire / Cyan) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="50%" stop-color="#1a5fb4"/>
      <stop offset="100%" stop-color="#0c3268"/>
    </linearGradient>

    <!-- Shield Vault Gradient -->
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>

    <!-- Cloud Accent Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#26a269"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Top Glass Highlight -->
  <path d="M 36 12 L 92 12 A 24 24 0 0 1 116 36 L 116 48 C 84 56 44 48 12 60 L 12 36 A 24 24 0 0 1 36 12 Z" fill="rgba(255,255,255,0.09)"/>

  <!-- Protective Vault Shield Base -->
  <path d="M 64 26 C 82 26 94 34 94 48 C 94 72 74 88 64 94 C 54 88 34 72 34 48 C 34 34 46 26 64 26 Z" fill="url(#vaultGrad)" filter="url(#innerShadow)"/>

  <!-- Vault Inner Core -->
  <path d="M 64 32 C 78 32 88 38 88 50 C 88 69 72 82 64 87 C 56 82 40 69 40 50 C 40 38 50 32 64 32 Z" fill="#0d2b45"/>

  <!-- Cloud Emblem (Upper half of Shield) -->
  <path d="M 54 49 A 6 6 0 0 1 65 46 A 7 7 0 0 1 76 50 A 5 5 0 0 1 77 58 L 52 58 A 5 5 0 0 1 54 49 Z" fill="url(#cloudGrad)"/>

  <!-- Storage Drive / Hardware Base (Lower half of Shield) -->
  <rect x="50" y="64" width="28" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="56" cy="70" r="2" fill="#3584e4"/>
  <rect x="62" y="68" width="12" height="4" rx="1.5" fill="#9a9996"/>

  <!-- Circular Sync / Restore Loop Arrows (Encircling Shield) -->
  <!-- Top Right Arrow -->
  <path d="M 76 22 A 44 44 0 0 1 106 62" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="104,54 112,64 100,66" fill="#f6d32d"/>

  <!-- Bottom Left Arrow -->
  <path d="M 52 102 A 44 44 0 0 1 22 62" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="24,70 16,60 28,58" fill="#f6d32d"/>

  <!-- Small Glowing Status Indicator -->
  <circle cx="98" cy="98" r="8" fill="#33d17a" stroke="#ffffff" stroke-width="2"/>
  <path d="M 95 98 L 97 100 L 102 95" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
