# PipeWire speaker protection filter for Xiaomi Pad 5 (nabu)
# Protects quad CS35L41 micro-speakers from excessive excursion ($Xmax)
# and voice-coil bottoming out on sub-bass transients (e.g. kick drums).

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Protected Speakers"
            media.name       = "Protected Speakers"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = hpf1_l
                        label = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = hpf2_l
                        label = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = hpf1_r
                        label = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = hpf2_r
                        label = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                ]
                links = [
                    { output = "hpf1_l:Out" input = "hpf2_l:In" }
                    { output = "hpf1_r:Out" input = "hpf2_r:In" }
                ]
                inputs = [ "hpf1_l:In" "hpf1_r:In" ]
                outputs = [ "hpf2_l:Out" "hpf2_r:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.nabu_spk_protect"
                media.class      = "Audio/Sink"
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name   = "effect_output.nabu_spk_protect"
                node.target = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.passive = true
            }
        }
    }
]
