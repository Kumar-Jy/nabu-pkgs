# Buffer and latency alignment for web browsers during heavy video decoding
pulse.rules = [
    {
        matches = [
            { application.process.binary = "chrome" }
            { application.process.binary = "google-chrome" }
            { application.process.binary = "google-chrome-stable" }
            { application.process.binary = "chromium" }
            { application.process.binary = "brave" }
            { application.process.binary = "firefox" }
            { application.name = "~.*(Chrome|Chromium|Brave|Firefox).*" }
        ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
                pulse.min.req     = 1024/48000
                node.latency      = 2048/48000
            }
        }
    }
]
