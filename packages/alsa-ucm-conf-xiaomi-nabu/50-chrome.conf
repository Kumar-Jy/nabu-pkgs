# Buffer and latency alignment for Chromium/Chrome during heavy video decoding
pulse.rules = [
    {
        matches = [
            { application.process.binary = "chrome" }
            { application.process.binary = "google-chrome" }
            { application.process.binary = "chromium" }
            { application.name = "~.*Chrome.*" }
            { application.name = "~.*Chromium.*" }
        ]
        actions = {
            update-props = {
                pulse.min.quantum = 960/48000
                pulse.min.req     = 960/48000
                node.latency      = 1920/48000
            }
        }
    }
]
